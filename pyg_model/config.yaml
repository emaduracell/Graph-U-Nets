# Model hyperparameters for PyG Graph U-Net
model:
  hidden_channels: 128
  depth: 3
  pool_ratios: [0.8, 0.8, 0.8]
  mlp_hidden: 256
  mlp_dropout: 0.0

# Data loading from TFRecord/meta.json
data:
  data_dir: "data"     # relative to pyg_model/
  split: "train"
  preprocessed_dir: "/scratch/izar/durante/graph_unets/graph_unet_preprocessed"  # generated by preprocess_graph_unet.py
  selected_traj_ids: "0-10"  # list of trajectory ids to use (null = all)
  selected_time_ids: null        # optional list of time indices to use (null = all)
  normalization_method: "standard"   # "centroid" or "standard"
  include_mesh_pos: true             # true or false
# Training parameters (single GPU)
training:
  lr: 0.0001
  epochs: 300
  batch_size: 128
  shuffle: false
  weight_decay: 0.0001
  val_split: 0.2
  seed: 42
  num_workers: 16
  radius: 0.03
  device: "cuda"       # "auto", "cpu", "cuda", or "mps"
  checkpoint_path: "pyg_graph_unet.pt"
  mode: "standard"    # "standard" or "overfit"
  overfit_traj_id: [0]   # trajectory id to overfit on
  overfit_time_idx: [0,1,2,3]  # list of time indices to overfit on (null = all in traj)
